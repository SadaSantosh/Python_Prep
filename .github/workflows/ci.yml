name: CI — Tests & Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Validate Python syntax (all .py files)
        run: |
          python -m py_compile project_01_student_performance_classifier/ml_basic.py
          python -m py_compile project_01_student_performance_classifier/ml_viz.py
          python -m py_compile project_01_student_performance_classifier/ml_predict.py
          python -m py_compile project_02_corporate_employee_analytics/data_analysis.py
          python -m py_compile project_02_corporate_employee_analytics/model_training.py
          python -m py_compile Project_03_Telco_Customer_Churn/data_preprocessing.py
          python -m py_compile Project_03_Telco_Customer_Churn/model_training.py
          python -m py_compile Project_03_Telco_Customer_Churn/eda_audit.py
          python -m py_compile Project_03_Telco_Customer_Churn/dataset_setup.py
          python -m py_compile Project_03_Telco_Customer_Churn/advanced_eval.py
          python -m py_compile project_04_real_estate_ai/train_model.py
          python -m py_compile project_05_spam_phishing_detector/train_model.py

      - name: Run unit tests
        run: |
          pytest tests/ -v --tb=short

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run flake8 (non-blocking)
        run: |
          flake8 --max-line-length=120 --ignore=E501,W503,E722 --count --statistics \
            project_01_student_performance_classifier/ \
            project_02_corporate_employee_analytics/ \
            Project_03_Telco_Customer_Churn/ \
            project_04_real_estate_ai/ \
            project_05_spam_phishing_detector/ \
            tests/ || true

  deploy-streamlit:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    strategy:
      matrix:
        project:
          - name: Telco Churn
            dir: Project_03_Telco_Customer_Churn
            app: app.py
          - name: Real Estate AI
            dir: project_04_real_estate_ai
            app: app.py
          - name: Spam Detector
            dir: project_05_spam_phishing_detector
            app: app.py

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Notify deployment readiness
        run: |
          echo "✅ Tests passed for ${{ matrix.project.name }}"
          echo "📂 Directory: ${{ matrix.project.dir }}/${{ matrix.project.app }}"
          echo "🚀 Ready for Streamlit Community Cloud deployment"
